name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  config:
    name: Config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ESPHome
        run: pip install "esphome==2026.9.0"
      - name: Validate fixtures
        run: ./tests/validate.sh

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run SPSCRingBuffer unit tests
        run: ./tests/unit/run.sh

  host-runtime:
    name: Host runtime tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ESPHome
        run: pip install "esphome==2026.9.0"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: host-runtime-esphome-2026.9.0-${{ runner.os }}
      - name: Run host runtime tests
        run: python3 tests/host/run_tests.py

  compile:
    name: Compile ${{ matrix.fixture }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fixture: [esp32_arduino, esp32_idf, esp8266]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ESPHome
        run: pip install "esphome==2026.9.0"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: compile-${{ matrix.fixture }}-esphome-2026.9.0
      - name: Compile
        run: esphome compile tests/compile/${{ matrix.fixture }}.yaml
